<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Mau Mau</title>
  <style>
    body {
      font-family: sans-serif;
      background: #28a745;
      text-align: center;
      color: white;
      font-size: 18px;
      margin: 0;
      padding: 0;
    }

    h1 {
      font-size: 36px;
    }

    #gameContainer {
      width: 100%; /* Base width for the game */
      margin: 0 auto;
      transform-origin: top center; /* Ensure scaling happens from the top center */
    }

    #gameArea {
      background: #0c6b0c;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      color: black;
    }
    
    #topCardContainer {
      display: flex;
      justify-content: center;
      margin: 2px 0;
      background-color: #28a745;
    }

    .card {
      width: 220px; /* Adjust card size */
      height: 380px;
      margin: 1px;
      border-radius: 1px;
      background-repeat: no-repeat;
      background-size: contain;
      background-position: center;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: scale(1.1);
    }

    .valid {
      border: 2px solid #28a745;
    }

    .invalid {
      opacity: 0.4;
    }

    #topCard {
      border-radius: 10px;
      /* background-image: url('Full-Deck-Of-Ornate-Playing-Cards.svg'); */
      background-repeat: no-repeat;
      
      background-position: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    #playerHand, #computerHand {
      font-weight: bold;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      color: white;
      font-size: 16px;
      background: #28a745;
      /* padding: 10px; */
      border-radius: 5px;
    }

     /* Computer's cards (50% smaller) */
  #computerHand .card {
    width: 130px; /* 50% of the original width */
    height: 188.5px; /* 50% of the original height */
    background-size: contain; /* Ensure the card back scales proportionally */
    background-position: center;
  }


    #drawCardButton {
      padding: 10px 20px;
      font-size: 16px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      margin: 10px;
      cursor: pointer;
    }

    #drawCardButton:hover {
      background: #0056b3;
    }

    #message {
      font-size: 54px;
      color: #ffffff;
      background: #28a745;
      padding: 0px;
      border-radius: 5px;
      margin: 0px auto;
      max-width: 100%;
    }

    /* Media Queries for Responsiveness */
    @media (max-width: 1024px) {
      #gameContainer {
        transform: scale(1); 
      }

      .card, #topCard {
        width: 185px; /* Adjust card size for tablets */
        height: 318px;
      }

      h1 {
        font-size: 28px;
      }

      #message {
        font-size: 54px;  
      }

      #drawCardButton {
        font-size: 54px;
        padding: 8px 16px;
      }
    }

    @media (max-width: 768px) {
      #gameContainer {
        transform: scale(0.9); /* Scale down to 60% for smaller tablets */
      }

      .card, #topCard {
        width: 120px; /* Adjust card size for smaller tablets */
        height: 180px;
      }

      h1 {
        font-size: 24px;
      }

      #message {
        font-size: 18px;
      }

      #drawCardButton {
        font-size: 12px;
        padding: 6px 12px;
      }
    }

    @media (max-width: 480px) {
      #gameContainer {
        transform: scale(0.4); /* Scale down to 40% for mobile phones */
      }

      .card, #topCard {
        width: 198px; /* Adjust card size for mobile phones */
        height: 244px;
      }

      h1 {
        font-size: 20px;
      }

      #message {
        font-size: 16px;
      }

      #drawCardButton {
        font-size: 10px;
        padding: 5px 10px;
      }

      #playerHand, #computerHand {
        font-size: 14px;
      }
    }

    #suitSelectionDialog {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      border: 2px solid #28a745;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      text-align: center;
      z-index: 1000;
    }

    #suitSelectionDialog img:hover {
      transform: scale(1.1);
      transition: transform 0.2s ease;
    }
  </style>
</head>
<body>
  <h1>Mau Mau</h1>
  <div id="gameContainer">
    <div id="gameArea">
      <div id="computerHand"></div>
      <div id="message"></div>
      <div id="topCardContainer">
        <div id="topCard" class="card"></div>
      </div>
      <div id="playerHand">Deine Karten:</div>
      <button id="drawCardButton">Karte ziehen</button>
    </div>
  </div>
  <button id="restartButton" style="display: none; margin-top: 20px; padding: 10px 20px; font-size: 16px; cursor: pointer;">
    Spiel neu starten
  </button>

  <div id="suitSelectionDialog" style="display: none;">
    <h3>Wähle eine Farbe:</h3>
    <div style="display: flex; justify-content: center; gap: 20px;">
      <img src="images/cards/hearts_ace.svg" alt="Herz" data-suit="hearts" style="width: 100px; cursor: pointer;">
      <img src="images/cards/diamonds_ace.svg" alt="Karo" data-suit="diamonds" style="width: 100px; cursor: pointer;">
      <img src="images/cards/clubs_ace.svg" alt="Kreuz" data-suit="clubs" style="width: 100px; cursor: pointer;">
      <img src="images/cards/spades_ace.svg" alt="Pik" data-suit="spades" style="width: 100px; cursor: pointer;">
    </div>
  </div>

  <audio id="victorySound" src="sounds/victory.mp3" preload="auto"></audio>
  <audio id="drawSound" src="sounds/draw.mp3" preload="auto"></audio>
  <audio id="playSound" src="sounds/play.mp3" preload="auto"></audio>

  <script>
    const cardFilePath = (suit, rank) => {
      // Map suits and ranks to the corresponding file names
      return `images/cards/${suit}_${rank}.svg`;
    };
  </script>

  <script>
    const suits = ["hearts", "diamonds", "clubs", "spades"];
    const ranks = ["8", "9", "10", "jack", "queen", "king", "ace"];
    const suitMap = { "hearts": 0, "diamonds": 1, "clubs": 2, "spades": 3 };
    const rankMap = { 
      "8": 0, "9": 1, "10": 2, "jack": 3, "queen": 4, "king": 5, "ace": 6 
    };

    const suitTranslations = {
      hearts: "Herz",
      diamonds: "Karo",
      clubs: "Kreuz",
      spades: "Pik"
    };

    const cardWidth = 410;
    const cardHeight = 590;

    let deck = [], playerHand = [], computerHand = [], topCard, currentSuit = null, gameEnded = false;
    let discardPile = [];
    let currentTurn = "player"; // Start with the player's turn

    const playerHandDiv = document.getElementById("playerHand");
    const computerHandDiv = document.getElementById("computerHand");
    const topCardDiv = document.getElementById("topCard");
    const drawCardButton = document.getElementById("drawCardButton");
    const messageDiv = document.getElementById("message");

    function createDeck() {
      deck = [];
      for (let suit of suits) {
        for (let rank of ranks) {
          deck.push({ suit, rank });
        }
      }
    }

    function shuffleDeck() {
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
    }

    function dealCard() {
      if (deck.length === 0) {
        if (discardPile.length > 0) {
          // Shuffle the discard pile back into the deck
          deck = [...discardPile];
          discardPile = [];
          shuffleDeck();
          messageDiv.textContent = "Der Stapel war leer. Der Ablagestapel wurde gemischt.";
        } else {
          // No cards left to shuffle
          messageDiv.textContent = "Keine Karten mehr verfügbar!";
          return null;
        }
      }

      // Play the draw sound
      const drawSound = document.getElementById("drawSound");
      drawSound.play();

      return deck.pop();
    }

    function getCardPosition(card) {
      const rowIndex = suitMap[card.suit];
      const colIndex = rankMap[card.rank];
      const x = colIndex * 392;
      const y = rowIndex * 577;
      return `-${x}px -${y}px`;
    }

    function isValidMove(card) {
      if (topCard.rank === "jack" && currentSuit) {
        return card.suit === currentSuit || card.rank === "jack";
      }
      return card.rank === "jack" || card.suit === topCard.suit || card.rank === topCard.rank;
    }

    function displayHands() {
      // Clear the player's hand
      playerHandDiv.innerHTML = "";
      playerHand.forEach((card, index) => {
        const cardDiv = document.createElement("div");
        cardDiv.classList.add("card");
        cardDiv.style.backgroundImage = `url('${cardFilePath(card.suit, card.rank)}')`; // Set the card image
        cardDiv.addEventListener("click", () => playCard(index)); // Add click event
        playerHandDiv.appendChild(cardDiv);
      });

      // Clear the computer's hand
      computerHandDiv.innerHTML = ``;

      computerHand.forEach(() => {
        const cardDiv = document.createElement("div");
        cardDiv.classList.add("card");
        cardDiv.style.backgroundImage = `url('images/cards/backside.svg')`; // Use the backside image
        computerHandDiv.appendChild(cardDiv);
      });

      // Update the top card
      if (topCard) {
        topCardDiv.style.backgroundImage = `url('${cardFilePath(topCard.suit, topCard.rank)}')`;
      }
    }

    function playCard(index) {
      if (gameEnded || currentTurn !== "player") return; // Ensure it's the player's turn
      const card = playerHand[index];
      if (!isValidMove(card)) return alert("Ungültiger Zug!");

      // Prevent ending on Jack
      if (playerHand.length === 1 && card.rank === "jack") {
        alert("Du darfst das Spiel nicht mit einem Buben beenden!");
        return;
      }

      // Move the current top card to the discard pile
      if (topCard) {
        discardPile.push(topCard);
      }

      topCard = card;
      playerHand.splice(index, 1);

      // Update the top card visually
      topCardDiv.style.backgroundImage = `url('${cardFilePath(topCard.suit, topCard.rank)}')`;

      // Play the play sound
      const playSound = document.getElementById("playSound");
      playSound.play();

      if (card.rank === "7") {
        // Rule for "7": Computer draws 2 cards and skips its turn
        for (let i = 0; i < 2; i++) {
          const newCard = dealCard();
          if (newCard) {
            computerHand.push(newCard);
          } else {
            messageDiv.textContent = "Der Stapel ist leer! Computer kann keine Karte ziehen.";
            break;
          }
        }
        messageDiv.textContent = "Computer zieht 2 Karten. Du bist nochmal dran.";
        displayHands();
        return; // Player retains their turn
      }

      if (card.rank === "8") {
        // Rule for "8": Skip the computer's turn
        if (playerHand.length === 0) {
          endGame("Spieler"); // Player wins if no cards are left
          return;
        }
        messageDiv.textContent = "Du hast eine 8 gespielt. Computer wird übersprungen!";
        displayHands();
        return; // Player retains their turn
      }

      if (card.rank === "jack") {
        // Rule for "Jack": Wild card, player chooses the next suit
        chooseSuit();
        return;
      }

      currentSuit = null;

      if (playerHand.length === 0) {
        endGame("Spieler");
      } else {
        currentTurn = "computer"; // Switch to the computer's turn
        computerTurn();
      }
    }

    function chooseSuit() {
      const suitSelectionDialog = document.getElementById("suitSelectionDialog");
      suitSelectionDialog.style.display = "block"; // Show the dialog

      // Add click event listeners to the suit images
      suitSelectionDialog.querySelectorAll("img").forEach(img => {
        img.addEventListener("click", function () {
          const suit = this.getAttribute("data-suit"); // Get the selected suit
          currentSuit = suit;
          messageDiv.textContent = `Du hast ${currentSuit} (${suitTranslations[currentSuit]}) gewählt. Computer ist dran.`;
          suitSelectionDialog.style.display = "none"; // Hide the dialog
          currentTurn = "computer"; // Switch to the computer's turn
          computerTurn(); // Trigger the computer's turn
        });
      });
    }

    function nextTurn() {
      displayHands();
      setTimeout(() => {
        if (!gameEnded && playerHand.length > 0) {
          computerTurn();
        }
      }, 1000);
    }

    function computerTurn() {
      if (gameEnded || currentTurn !== "computer") return; // Ensure it's the computer's turn

      setTimeout(() => {
        for (let i = 0; i < computerHand.length; i++) {
          const card = computerHand[i];
          if (isValidMove(card)) {
            if (topCard) {
              discardPile.push(topCard); // Move the current top card to the discard pile
            }
            topCard = card;
            computerHand.splice(i, 1);

            // Play the play sound
            const playSound = document.getElementById("playSound");
            playSound.play();

            if (card.rank === "7") {
              // Rule for "7": Player draws 2 cards and the computer plays again
              for (let j = 0; j < 2; j++) {
                const newCard = dealCard();
                if (newCard) playerHand.push(newCard);
              }
              messageDiv.textContent = "Computer spielt 7. Du ziehst 2 Karten. Computer ist nochmal dran.";
              displayHands();
              setTimeout(() => computerTurn(), 500); // Computer plays again
              return;
            }

            if (card.rank === "8") {
              // Rule for "8": Skip the player's turn
              if (computerHand.length === 0) {
                endGame("Computer"); // Computer wins if no cards are left
                return;
              }
              messageDiv.textContent = "Computer spielt 8. Dein Zug wird übersprungen!";
              displayHands();
              setTimeout(() => computerTurn(), 500); // Computer plays again
              return;
            }

            if (card.rank === "jack") {
              // Rule for "jack": Computer chooses a suit it has in its hand
              const availableSuits = computerHand.map(c => c.suit);
              currentSuit = availableSuits.length > 0 ? availableSuits[Math.floor(Math.random() * availableSuits.length)] : null;

              if (currentSuit) {
                messageDiv.textContent = `Computer spielt Jack und wählt ${currentSuit} (${suitTranslations[currentSuit]})`;
              } else {
                messageDiv.textContent = "Computer spielt Jack, aber hat keine Karten der gewählten Farbe.";
              }

              displayHands();
              currentTurn = "player"; // Switch to the player's turn
              return;
            }

            currentSuit = null;
            messageDiv.textContent = `Computer spielt ${card.rank} von ${card.suit} (${suitTranslations[card.suit]})`;
            displayHands();
            if (computerHand.length === 0) {
              endGame("Computer");
            } else {
              currentTurn = "player"; // Switch to the player's turn
            }
            return;
          }
        }

        const newCard = dealCard();
        if (newCard) {
          computerHand.push(newCard);
          messageDiv.textContent = "Computer zieht eine Karte.";
        } else {
          messageDiv.textContent = "Computer kann nicht ziehen.";
        }
        displayHands();
        currentTurn = "player"; // Switch to the player's turn
      }, 2000); // Add a 3-second delay before the computer plays
    }

    function drawCard() {
      if (gameEnded || currentTurn !== "player") return; // Ensure it's the player's turn
      const card = dealCard();
      if (card) {
        playerHand.push(card);
        displayHands();
        messageDiv.textContent = "Du hast eine Karte gezogen. Computer ist dran.";
        currentTurn = "computer"; // Switch to the computer's turn
        computerTurn(); // Trigger the computer's turn
      } else {
        // If the deck is empty
        messageDiv.textContent = "Der Stapel ist leer! Computer ist dran.";
        currentTurn = "computer"; // Switch to the computer's turn
        computerTurn();
      }
    }

    function endGame(winner) {
      gameEnded = true;
      messageDiv.textContent = `${winner} hat gewonnen!`;

      // Play the victory sound if the player wins
      if (winner === "Spieler") {
        const victorySound = document.getElementById("victorySound");
        victorySound.play();
      }

      // Show the restart button
      const restartButton = document.getElementById("restartButton");
      restartButton.style.display = "block";

      // Add click event listener to restart the game
      restartButton.addEventListener("click", startGame);
    }

    function startGame() {
      createDeck();
      shuffleDeck();
      playerHand = [];
      computerHand = [];
      for (let i = 0; i < 5; i++) {
        playerHand.push(dealCard());
        computerHand.push(dealCard());
      }
      topCard = dealCard();
      gameEnded = false;
      currentSuit = null;
      drawCardButton.disabled = false;
      messageDiv.textContent = "Das Spiel beginnt! Du bist am Zug.";
      displayHands();
    }

    drawCardButton.addEventListener("click", drawCard);
    startGame();
  </script>
</body>
</html>
